services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.7
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_DB: learning
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-sink-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-sink-data:
