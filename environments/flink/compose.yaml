services:
  kafka:
    image: docker.io/apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 18

  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: flos
      MYSQL_USER: flos
      MYSQL_PASSWORD: flos
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=flos --password=flos"]
      interval: 5s
      timeout: 5s
      retries: 18

  jobmanager:
    image: docker.io/library/flink:2.2.1-scala_2.12-java17
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ../../modules/flink/operator-lab/target/operator-lab.jar:/opt/flink/usrlib/operator-lab.jar:ro
      - ../../modules/flink/pipeline-lab/target/pipeline-lab.jar:/opt/flink/usrlib/pipeline-lab.jar:ro
      - flink-checkpoints:/opt/flink/checkpoints
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-metrics-prometheus-2.2.1.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.max-concurrent-checkpoints: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 2 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18

  taskmanager:
    image: docker.io/library/flink:2.2.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ../../modules/flink/operator-lab/target/operator-lab.jar:/opt/flink/usrlib/operator-lab.jar:ro
      - ../../modules/flink/pipeline-lab/target/pipeline-lab.jar:/opt/flink/usrlib/pipeline-lab.jar:ro
      - flink-checkpoints:/opt/flink/checkpoints
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-metrics-prometheus-2.2.1.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/flink-alerts.yml:/etc/prometheus/flink-alerts.yml:ro
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 18

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 18

volumes:
  flink-checkpoints:
