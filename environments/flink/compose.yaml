services:
  kafka:
    image: docker.io/apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 18

  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: flos
      MYSQL_USER: flos
      MYSQL_PASSWORD: flos
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=flos --password=flos"]
      interval: 5s
      timeout: 5s
      retries: 18

  jobmanager:
    image: docker.io/library/flink:2.2.1-scala_2.12-java17
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ../../modules/flink/operator-lab/target/operator-lab.jar:/opt/flink/usrlib/operator-lab.jar:ro
      - ../../modules/flink/pipeline-lab/target/pipeline-lab.jar:/opt/flink/usrlib/pipeline-lab.jar:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18

  taskmanager:
    image: docker.io/library/flink:2.2.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ../../modules/flink/operator-lab/target/operator-lab.jar:/opt/flink/usrlib/operator-lab.jar:ro
      - ../../modules/flink/pipeline-lab/target/pipeline-lab.jar:/opt/flink/usrlib/pipeline-lab.jar:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
