[project]
name = "flos-automation"
version = "0.1.0"
description = "Automation for the Flos executable tutorials"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.15.22",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocs-awesome-pages-plugin==2.10.1",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
