[project]
name = "flos-automation"
version = "0.1.0"
description = "Automation for the Flos executable tutorials"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
